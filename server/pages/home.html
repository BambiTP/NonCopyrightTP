<div id="back-to-group" class="game-banner" style="display:none" data-group="{{GROUP_ID}}">
    You're still in a group. <a class="btn btn-primary" id="back-to-group-link" href="/groups">Back to it</a>
</div>
<div class="arena">
    <canvas id="arena" width="1120" height="280" data-tiles="{{TILES}}"></canvas>
    <div class="over">
        <a class="btn btn-primary btn-big" href="/games/find">Play</a>
        <div class="q" id="queue-casual">&nbsp;</div>
        <div class="side">
            <a class="btn" href="/groups/create">New group</a>
            <a class="btn" href="/games/find?type=ranked">Ranked eggball <span id="queue-ranked"></span></a>
        </div>
    </div>
</div>
<div class="home-cols">
    <div>
        <h2>Live</h2>
        <div class="list" id="live-games"><p class="muted">Nothing running.</p></div>
    </div>
    <div>
        <h2>Groups</h2>
        <div class="list" id="live-groups"><p class="muted">No open groups.</p></div>
    </div>
</div>
