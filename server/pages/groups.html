<h1>Groups</h1>
<form method="post" action="/groups/create" class="panel create-group">
    <label class="setting"><span>Name</span><input class="form-control" name="name" maxlength="32" placeholder="Group name"></label>
    <label class="setting"><span>Preset</span><input class="form-control" name="preset" placeholder="optional"></label>
    <label class="setting check"><input type="checkbox" name="public"> <span>Show it here</span></label>
    <label class="setting check"><input type="checkbox" name="private" checked> <span>Pick teams</span></label>
    <button id="create-group-btn" class="btn btn-primary">Create</button>
</form>
<div class="group-list">
{{GROUPS_LIST}}
</div>
