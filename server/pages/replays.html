<h1>Replays</h1>
<div class="filters" id="filters" data-user="{{USER_ID}}">
    <input id="f-map" class="form-control" style="max-width:220px" placeholder="Map name">
    <select id="f-vis"><option value="">All games</option><option>Casual</option><option>Private</option><option>Maptest</option></select>
    <label class="setting check" id="f-mine-wrap"><input type="checkbox" id="f-mine"> <span>Only my games</span></label>
</div>
<table class="table table-hover">
    <thead><tr><th>When</th><th>Map</th><th>Type</th><th class="text-center">Score</th><th>Length</th><th>Players</th><th></th></tr></thead>
    <tbody id="replay-rows"><tr><td colspan="7" class="muted">Loading...</td></tr></tbody>
</table>
<div class="text-center">
    <button id="prev" class="btn btn-default btn-sm" type="button">&larr; Newer</button>
    <span id="page-no" class="muted" style="margin:0 10px"></span>
    <button id="next" class="btn btn-default btn-sm" type="button">Older &rarr;</button>
</div>
